<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>视频 ↔ GPX/KML 同步地图</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;font-family:"Microsoft YaHei",Arial,sans-serif;}
  #container{display:flex;flex-direction:row;width:100%;height:100%;}
  #videoPanel{
    width:60%;min-width:300px;max-width:85%;
    display:flex;align-items:center;justify-content:center;
    background:#000;transition:width 0.1s linear;
  }
  video{width:96%;height:auto;max-height:92%;background:#000;outline:none;border:2px solid #333;border-radius:6px;}
  #divider{
    width:8px;background:#ddd;cursor:col-resize;
    box-shadow:inset 0 0 4px rgba(0,0,0,0.2);
  }
  #mapPanel{flex:1;display:flex;flex-direction:column;}
  #controls{
    padding:8px 10px;background:#f7f7f7;border-bottom:1px solid #ccc;
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;
  }
  #map{flex:1;}
  label{margin-right:4px;white-space:nowrap;}
  input[type="file"]{font-size:13px;}
  .status{font-size:13px;color:#555;margin-left:auto;}
  .leaflet-control-attribution{font-size:10px;}
  .kml-label{
    background:rgba(0,0,0,0.7);color:#fff;border-radius:3px;
    padding:1px 4px;font-size:11px;border:none;
  }
  .control-row{display:flex;align-items:center;gap:4px;margin-right:8px;}
  button{padding:5px 10px;border-radius:5px;border:1px solid:#ccc;background:#fff;cursor:pointer;}
  button:hover{background:#f0f0f0;}
</style>
</head>
<body>
<div id="container">
  <div id="videoPanel">
    <video id="video" controls preload="metadata" playsinline></video>
  </div>
  <div id="divider"></div>
  <div id="mapPanel">
    <div id="controls">
      <div class="control-row">
        <label>🎬 视频文件</label>
        <input id="videoFile" type="file" accept="video/*">
      </div>

      <div class="control-row">
        <label>📍 GPX 文件</label>
        <input id="gpxFile" type="file" accept=".gpx">
      </div>

      <div class="control-row">
        <label>📘 KML 文件</label>
        <input id="kmlFile" type="file" accept=".kml">
      </div>

      <div class="control-row" style="margin-top:10px;">
        <label><input type="checkbox" id="showGPX" checked> 显示GPX</label>
        <label><input type="checkbox" id="showKML" checked> 显示KML</label>
        <button id="fitAll">轨迹全图</button>
      </div>

      <div class="control-row">
        <label><input type="checkbox" id="follow" checked> 跟随当前位置</label>
        <button id="zoomCurrent">定位当前</button>
      </div>

      <!-- 🕐 新增时间偏移设置 -->
      <div class="control-row">
        <label>🕐 GPX时间偏移 (秒)：</label>
        <input type="number" id="offsetInput" value="0" step="0.1">
        <span style="font-size:13px;color:#555;">(正值=GPX提前录制)</span>
      </div>

      <!-- 🎞 频率设置：视频频率 -->
      <div class="control-row">
        <label>🎞 视频频率 (Hz)：</label>
        <input type="number" id="videoFreqInput" value="30" step="0.1">
      </div>

      <div class="status" id="status">请选择视频和GPX/KML文件。</div>
    </div>

    <!-- 时间标记点功能面板（原始布局保持不变） -->
    <div id="markerPanel" style="display:block;padding:8px 10px;background:#f0f8ff;border-bottom:1px solid #ccc;">
      <div class="control-row">
        <label>📍 标记点名称：</label>
        <input type="text" id="markerName" placeholder="输入标记点名称" style="width:120px;">
      </div>
      
      <div class="control-row">
        <label>⏰ 时间设置：</label>
        <input type="number" id="markerHour" min="0" max="23" value="0" style="width:50px;">时
        <input type="number" id="markerMinute" min="0" max="59" value="0" style="width:50px;">分
        <input type="number" id="markerSecond" min="0" max="59" value="0" style="width:50px;">秒
      </div>
      
      <div class="control-row">
        <button id="addMarker">添加标记点</button>
        <button id="clearMarkers">清空标记</button>
        <button id="exportKML">导出KML</button>
        <button id="exportCSV">导出CSV</button>
      </div>
      
      <div class="control-row" id="markerResult" style="font-size:12px;color:#666;"></div>
      
      <div class="control-row" id="coordinatePreview" style="font-size:11px;color:#888;font-style:italic;"></div>
      
      <div class="control-row" id="markerStats" style="font-size:12px;color:#666;background:#f9f9f9;padding:4px 8px;border-radius:3px;"></div>
    </div>
    
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.obf.utf8.js"></script>
<script>
// 调试：检查功能模块加载状态
document.addEventListener('DOMContentLoaded', function() {
    console.log("=== 时间标记点功能模块详细检查 ===");
    console.log("当前页面URL:", window.location.href);
    console.log("页面标题:", document.title);
    
    // 检查所有DOM元素
    const elements = [
        'markerPanel', 'markerName', 'markerHour', 'markerMinute', 'markerSecond',
        'addMarker', 'clearMarkers', 'exportKML', 'exportCSV',
        'markerResult', 'coordinatePreview', 'markerStats'
    ];
    
    elements.forEach(id => {
        const element = document.getElementById(id);
        console.log(`${id}:`, element ? `✅ 存在 (${element.tagName})` : '❌ 不存在');
        if (element) {
            console.log(`  - 样式display:`, element.style.display);
            console.log(`  - 可见性:`, element.offsetParent ? '可见' : '隐藏');
        }
    });
    
    console.log("JavaScript函数检查:");
    console.log("findGpxPointByTime:", typeof findGpxPointByTime);
    console.log("addCustomMarker:", typeof addCustomMarker);
    console.log("customMarkers数组长度:", customMarkers ? customMarkers.length : '未定义');
    console.log("gpxTimeData数组长度:", gpxTimeData ? gpxTimeData.length : '未定义');
    
    console.log("=== 检查完成 ===");
});
</script>
</body>
</html>
