<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>公路时空智映平台</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;font-family:"Microsoft YaHei",Arial,sans-serif;}
  #container{display:flex;flex-direction:row;width:100%;height:100%;}
  #videoPanel{
    width:60%;min-width:300px;max-width:85%;
    display:flex;align-items:center;justify-content:center;
    background:#000;transition:width 0.1s linear;
  }
  video{width:96%;height:auto;max-height:92%;background:#000;outline:none;border:2px solid #333;border-radius:6px;}
  #mapPanel{flex:1;display:flex;flex-direction:column;}
  #appHeader{
    padding:10px 12px;
    background:linear-gradient(90deg,#1f3b57,#2c5b7c);
    color:#fff;font-size:18px;font-weight:700;letter-spacing:1px;text-align:center;
  }
  #controls{
    padding:6px 10px;background:#f7f7f7;border-bottom:1px solid #ccc;
    font-size:13px;line-height:1.6;
  }
  #map{flex:1;}
  #dragHandle{
    width:6px;cursor:col-resize;background:#333;position:relative;z-index:999;
  }
  #dragHandle::before{
    content:"";position:absolute;top:50%;left:1px;right:1px;
    height:30px;margin-top:-15px;border-left:2px solid #aaa;border-right:2px solid #aaa;
  }
  .status{margin-top:4px;font-size:12px;color:#333;}
  input[type="number"],input[type="text"],select{
    font-size:12px;padding:2px 4px;border:1px solid #ccc;border-radius:3px;
  }
  button{
    font-size:12px;padding:3px 8px;margin-right:5px;margin-top:3px;
    border:1px solid #999;border-radius:3px;background:#eee;cursor:pointer;
  }
  button:hover{background:#ddd;}
  .kml-label{font-size:12px;font-weight:bold;color:#0066cc;text-shadow:0 0 2px #fff;}
  .flex-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .control-row{margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
  .control-row label{min-width:70px;font-weight:bold;}
  #markerPanel{border-top:1px dashed #ccc;padding-top:4px;font-size:12px;}
  #measureInfo{font-size:12px;color:#333;margin-left:4px;}
</style>
</head>
<body>
<div id="container">
  <div id="videoPanel">
    <video id="video" controls></video>
  </div>
  <div id="dragHandle"></div>
  <div id="mapPanel">
    <div id="appHeader">公路时空智映平台</div>
    <div id="controls">
      <div class="control-row">
        <label>🎬 视频文件</label>
        <input id="videoFile" type="file" accept="video/*">
      </div>

      <div class="control-row">
        <label>📍 GPX 文件</label>
        <input id="gpxFile" type="file" accept=".gpx">
      </div>

      <div class="control-row">
        <label>📘 KML 文件</label>
        <input id="kmlFile" type="file" accept=".kml">
      </div>

      <div class="control-row" style="margin-top:10px;">
        <label><input type="checkbox" id="showGPX" checked> 显示GPX</label>
        <label><input type="checkbox" id="showKML" checked> 显示KML</label>
        <button id="fitAll">轨迹全图</button>
		<label><input type="checkbox" id="follow" checked> 跟随当前位置</label>
        <button id="zoomCurrent">定位当前</button>
      </div>

      <div class="control-row">
        <button id="measureToggle">开始测距</button>
        <button id="measureClear">清除测距</button>
        <span id="measureInfo" style="font-size:12px;color:#666;margin-left:8px;"></span>
      </div>

      <!-- 🕐 新增时间偏移设置 -->
      <div class="control-row">
        <label>🕐 GPX时间偏移 (秒)：</label>
        <input type="number" id="offsetInput" value="0" step="0.1">
        <span style="font-size:13px;color:#555;">(正值=GPX提前录制)</span>
      </div>

      <!-- 🎞 频率设置：视频频率 -->
<!--       <div class="control-row">
        <label>🎞 视频频率 (Hz)：</label>
        <input type="number" id="videoFreqInput" value="30" step="0.1">
      </div> -->

      <div class="status" id="status">请选择视频和GPX/KML文件。</div>
    </div>

  <!-- 时间标记点功能面板（原始布局保持不变） -->
    <div id="markerPanel" style="display:block;padding:8px 10px;background:#f0f8ff;border-bottom:1px solid #ccc;">
      <div class="control-row">
        <label>📍 标记点名称：</label>
        <input type="text" id="markerName" placeholder="输入标记点名称" style="width:120px;">
      </div>
      
<!--       <div class="control-row">
        <label>⏰ 时间设置：</label>
        <input type="number" id="markerHour" min="0" max="23" value="0" style="width:50px;">时
        <input type="number" id="markerMinute" min="0" max="59" value="0" style="width:50px;">分
        <input type="number" id="markerSecond" min="0" max="59.999" value="0" style="width:70px;">秒
      </div> -->
	  
      <div class="control-row">
        <label>🧭 WGS84 坐标：</label>
        <input type="text" id="markerWgs" placeholder="例如 30.529522,114.237251" style="width:220px;">
      </div>

	  
	        <div class="control-row">
        <button id="addMarker" style="display:none">按输入时间添加标记</button>
        <button id="addMarkerByWgs">按WGS84坐标添加标记</button>
        <button id="addMarkerFromVideo">用当前视频位置添加标记</button>
        <button id="clearMarkers">清空标记</button>
        <button id="exportKML">导出KML</button>
        <button id="exportCSV">导出CSV</button>
      </div>

      
      <div class="control-row" id="markerResult" style="font-size:12px;color:#666;"></div>
      
      <div class="control-row" id="coordinatePreview" style="font-size:11px;color:#888;font-style:italic;">
      </div>

      <div class="control-row" id="markerStats" style="font-size:12px;color:#333;background:#f9f9f9;padding:4px 8px;border-radius:3px;"></div>
    </div>

    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.obf.js"></script>
<script>
// 调试：检查时间标记点功能模块是否正常挂载
document.addEventListener('DOMContentLoaded', function() {
    console.log("=== 时间标记点功能模块详细检查 ===");
    console.log("当前页面URL:", window.location.href);
    console.log("页面标题:", document.title);
    
    const elements = [
        'markerPanel', 'markerName', 'markerHour', 'markerMinute', 'markerSecond',
        'addMarker', 'clearMarkers', 'exportKML', 'exportCSV',
        'markerResult', 'coordinatePreview', 'markerStats'
    ];
    
    elements.forEach(id => {
        const element = document.getElementById(id);
        console.log(`${id}:`, element ? `✅ 存在 (${element.tagName})` : '❌ 不存在');
        if (element) {
            console.log(`  - 样式display:`, element.style.display);
            console.log(`  - 可见性:`, element.offsetParent ? '可见' : '隐藏');
        }
    });
    
    console.log("JavaScript函数检查:");
    console.log("findGpxPointByTime:", typeof findGpxPointByTime);
    console.log("addCustomMarker:", typeof addCustomMarker);
    console.log("customMarkers数组长度:", customMarkers ? customMarkers.length : '未定义');
    console.log("gpxTimeData数组长度:", gpxTimeData ? gpxTimeData.length : '未定义');
    
    console.log("=== 检查完成 ===");
});
</script>
</body>
</html>
